<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#ffffff"/>

  <rect x="330" y="30" width="260" height="56" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="460" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="#4338ca">SubNex</text>
  <text x="460" y="76" text-anchor="middle" font-size="11" fill="#64748b">Where your assets hide, SubNex finds.</text>

  <!-- Frontend -->
  <rect x="40" y="180" width="220" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="150" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Browser / React UI</text>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#64748b">TypeScript + Tailwind</text>
  <text x="150" y="244" text-anchor="middle" font-size="11" fill="#64748b">Topology · Inventory · Findings</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#64748b">Live scan feed (WebSocket)</text>

  <!-- Backend -->
  <rect x="350" y="180" width="220" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="460" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">FastAPI Backend</text>
  <text x="460" y="226" text-anchor="middle" font-size="11" fill="#475569">REST + WebSocket API</text>
  <text x="460" y="242" text-anchor="middle" font-size="11" fill="#475569">Celery scan orchestrator</text>
  <text x="460" y="258" text-anchor="middle" font-size="11" fill="#475569">Risk rules · topology · reports</text>
  <text x="460" y="276" text-anchor="middle" font-size="11" fill="#475569">serves the built UI on :8000</text>

  <!-- Postgres -->
  <rect x="350" y="330" width="100" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="400" y="374" text-anchor="middle" font-size="10" fill="#64748b">scans · hosts</text>
  <text x="400" y="388" text-anchor="middle" font-size="10" fill="#64748b">findings · audit</text>

  <!-- Redis -->
  <rect x="470" y="330" width="100" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Redis</text>
  <text x="520" y="374" text-anchor="middle" font-size="10" fill="#64748b">Celery broker</text>
  <text x="520" y="388" text-anchor="middle" font-size="10" fill="#64748b">pause / stop state</text>

  <!-- Agent -->
  <rect x="660" y="180" width="220" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="770" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Scanner Agent (target LAN)</text>
  <text x="770" y="228" text-anchor="middle" font-size="11" fill="#475569">Nmap: ARP · raw-SYN · OS -O</text>
  <text x="770" y="244" text-anchor="middle" font-size="11" fill="#475569">Scapy (passive): DHCP · CDP/LLDP</text>
  <text x="770" y="260" text-anchor="middle" font-size="11" fill="#475569">claims tasks, posts results</text>

  <!-- Target network -->
  <rect x="40" y="460" width="840" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="460" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Target network (authorized scope)</text>
  <text x="460" y="500" text-anchor="middle" font-size="11" fill="#64748b">servers · printers · cameras · routers · switches · IoT · phones · NAS</text>

  <!-- Edges -->
  <line x1="260" y1="225" x2="348" y2="225" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="304" y="208" text-anchor="middle" font-size="10" fill="#64748b">REST +</text>
  <text x="304" y="221" text-anchor="middle" font-size="10" fill="#64748b">WebSocket</text>

  <line x1="570" y1="225" x2="658" y2="225" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="208" text-anchor="middle" font-size="10" fill="#64748b">HTTPS +</text>
  <text x="614" y="221" text-anchor="middle" font-size="10" fill="#64748b">API key</text>

  <line x1="460" y1="292" x2="460" y2="328" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrl)"/>
  <text x="492" y="313" text-anchor="middle" font-size="10" fill="#6366f1">async SQLAlchemy</text>

  <line x1="520" y1="292" x2="520" y2="328" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrl)"/>
  <text x="548" y="313" text-anchor="middle" font-size="10" fill="#6366f1">Celery</text>

  <line x1="770" y1="272" x2="770" y2="458" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="292" x2="460" y2="458" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="4 3"/>
  <text x="598" y="372" text-anchor="middle" font-size="10" fill="#64748b">L2 discovery + fingerprint results flow back</text>
</svg>